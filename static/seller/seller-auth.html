<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Authentication - ReWear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="seller-auth.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="../home.html" class="logo">
        <span class="logo-text">ReWear</span>
        <span class="logo-leaf">♻</span>
      </a>
    </div>
  </header>

  <!-- Auth Section -->
  <main class="auth-container">
    <div class="auth-card">

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" data-tab="login">Login</div>
        <div class="tab" data-tab="signup">Sign Up</div>
      </div>

      <!-- LOGIN -->
      <div class="form-container" id="login-form">
        <h1>Seller Login</h1>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <!-- ✅ IMPORTANT: ID Added -->
        <form id="login-form-element">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="seller@example.com" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn">Login</button>
        </form>

        <div class="switch-link">
          New seller? <a href="seller-auth.js" data-switch="signup">Create an account</a>
        </div>
      </div>

      <!-- SIGNUP -->
      <div class="form-container form-hidden" id="signup-form">
        <h1>Seller Sign Up</h1>
        <p class="subtitle">Join ReWear and start selling sustainably</p>

        <!-- ✅ IMPORTANT: ID Added -->
        <form id="signup-form-element">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" required>
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required>
          </div>

          <div class="form-group">
            <label for="signup-phone">Phone Number</label>
            <input type="tel" id="signup-phone" required>
          </div>

          <div class="form-group">
            <label for="signup-address">Address</label>
            <input type="text" id="signup-address" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required>
          </div>

          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" required>
          </div>

          <button type="submit" class="btn">Create Seller Account</button>

          <div class="terms-note">
            By signing up, you agree to our 
            <a href="/terms">Terms of Service</a> and 
            <a href="/privacy">Privacy Policy</a>
          </div>
        </form>

        <div class="switch-link">
          Already have an account? <a href="#" data-switch="login">Login here</a>
        </div>
      </div>

    </div>
  </main>

  <script src="seller-auth.js"></script>
</body>
</html>
