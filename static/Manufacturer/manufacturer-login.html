<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manufacturer / Brand Login – ReWear</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="manufacturer-login.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-text">ReWear</span>
        <span class="logo-leaf">♻</span>
      </a>
    </div>
  </header>

  <!-- Login Card -->
  <main class="login-wrapper">
    <div class="login-card">

      <div class="brand-badge">
        <span>Manufacturer / Brand Portal</span>
      </div>

      <h1>Manufacturer / Brand Login</h1>
      <p class="subtitle">Access your recycling and product management dashboard</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Registered Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="brand@company.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <a href="#" class="forgot-link">Forgot password?</a>

      <div class="extra-info">
        Manufacturer accounts are created and verified<br>
        by ReWear Admin team
      </div>

      <div class="security-note">
        <span class="security-icon">🔒</span>
        <span>Secure connection • Verified access only</span>
      </div>

    </div>
  </main>

  <script src="manufacturer-login.js"></script>
</body>
</html>
