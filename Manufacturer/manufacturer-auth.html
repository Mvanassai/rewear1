<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manufacturer Login – ReWear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="manufacturer-auth.css">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="Home.html" class="logo">
        <span class="logo-text">ReWear</span>
        <span class="logo-leaf">♻</span>
      </a>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h1>Manufacturer / Brand Login</h1>
      <p class="subtitle">Access your brand dashboard and sustainability tools</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Registered Email</label>
          <input type="email" id="email" placeholder="brand@company.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login">Login</button>
      </form>

      <div class="extra-info">
        Brand accounts are created and verified by ReWear team
      </div>
    </div>
  </main>

  <script src="manufacturer-auth.js"></script>
</body>
</html>
