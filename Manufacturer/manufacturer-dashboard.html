<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manufacturer Dashboard – ReWear</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="manufacturer-dashboard.css">
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <a href="../home.html" class="logo">
      ReWear <span class="logo-leaf">♻</span>
    </a>

    <div class="header-right">
      <span>Signed in as <strong>Brand</strong></span>
      <button id="logout-btn" class="btn-logout">Logout</button>
    </div>
  </header>

  <!-- Main -->
  <main class="container">
    <h1>Manufacturer Dashboard</h1>
    <p class="subtitle">Manage your products, programs, and partnerships</p>

    <!-- Stats -->
    <section class="grid">
      <div class="card">
        <span class="stat-value">1.2k</span>
        <span class="stat-label">Products Managed</span>
      </div>
      <div class="card">
        <span class="stat-value">3.4t</span>
        <span class="stat-label">CO₂ Reclaimed</span>
      </div>
      <div class="card">
        <span class="stat-value">12</span>
        <span class="stat-label">Active Partnerships</span>
      </div>
    </section>

    <!-- Add Product -->
    <section class="section">
      <h2>Add Product / Program</h2>
      <div class="card">
        <form id="add-product-form">
          <div class="form-row">
            <input name="title" placeholder="Product title" required>
            <input name="price" type="number" placeholder="Price (₹)" required>
          </div>

          <textarea name="description" rows="3" placeholder="Short description"></textarea>

          <div class="btn-group">
            <button type="submit" class="btn">Submit</button>
            <button type="reset" class="btn secondary">Reset</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Partner Requests -->
<section class="section">
  <h2>Seller Cloth Requests</h2>
  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Size</th>
          <th>Condition</th>
          <th>Price</th>
          <th>Location</th>
          <th>Image</th>
        </tr>
      </thead>
      <tbody id="cloth-table-body">
        <tr>
          <td colspan="7">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
  </main>

  <!-- JS -->
  <script src="manufacturer-dashboard.js"></script>
</body>
</html>
